<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Capitaine Ad’Hoc — Mers & Océans</title>
  <meta name="description" content="Association Capitaine Ad’Hoc — Mers & Océans. Mobilisations, projets, engagements, partenaires, adhésions & dons." />
  <link rel="preconnect" href="https://unpkg.com" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ocean: '#0b2e4e',
            lagoon: '#11b5c2',
            foam: '#f0f9ff'
          },
          boxShadow: {
            soft: '0 10px 30px rgba(0,0,0,0.12)'
          }
        }
      }
    }
  </script>
  <style>
    .glass { backdrop-filter: blur(8px); background: rgba(255,255,255,0.08); }
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="bg-foam text-slate-900">
  <div id="app"></div>

  <script type="module">
    const { createApp, ref, computed } = Vue;
    const { createRouter, createWebHistory } = VueRouter;

    // -------------------- UI: Layout --------------------
    const AppLayout = {
      template: `
      <div class="min-h-screen flex flex-col">
        <header class="sticky top-0 z-50 bg-ocean/90 text-white glass border-b border-white/10">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
              <a href="/" class="flex items-center gap-3 group">
                <div class="w-9 h-9 rounded-none bg-lagoon/90 grid place-items-center shadow-soft">
                  <span class="font-black">A</span>
                </div>
                <div class="leading-tight">
                  <div class="font-bold tracking-wide">Capitaine Ad’Hoc</div>
                  <div class="text-xs opacity-80">Mers & Océans · Antibes</div>
                </div>
              </a>
              <nav class="hidden md:flex items-center gap-6 text-sm">
                <RouterLink to="/" class="hover:text-lagoon">Accueil</RouterLink>
                <RouterLink to="/mobilisations" class="hover:text-lagoon">Mobilisations</RouterLink>
                <RouterLink to="/association" class="hover:text-lagoon">Association</RouterLink>
                <RouterLink to="/engagements" class="hover:text-lagoon">Engagements</RouterLink>
                <RouterLink to="/partenaires" class="hover:text-lagoon">Partenaires</RouterLink>
                <RouterLink to="/adhesion-dons" class="hover:text-lagoon">Adhésion & Dons</RouterLink>
                <RouterLink to="/agenda" class="hover:text-lagoon">Agenda</RouterLink>
                <RouterLink to="/contact" class="hover:text-lagoon">Contact</RouterLink>
              </nav>
              <RouterLink to="/adhesion-dons" class="hidden md:inline-flex items-center gap-2 bg-lagoon text-ocean font-semibold px-3 py-2 rounded-xl shadow-soft hover:opacity-90 transition">
                Rejoindre la flotte
              </RouterLink>
              <button @click="open = !open" class="md:hidden p-2 rounded-lg hover:bg-white/10" aria-label="Menu">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path fill-rule="evenodd" d="M3.75 6.75A.75.75 0 014.5 6h15a.75.75 0 010 1.5h-15a.75.75 0 01-.75-.75zm0 10.5a.75.75 0 01.75-.75h15a.75.75 0 010 1.5h-15a.75.75 0 01-.75-.75zm0-5.25a.75.75 0 01.75-.75h15a.75.75 0 010 1.5h-15a.75.75 0 01-.75-.75z" clip-rule="evenodd"/></svg>
              </button>
            </div>
          </div>
          <div v-if="open" class="md:hidden border-t border-white/10">
            <div class="px-4 py-3 space-y-2">
              <RouterLink @click.native="open=false" to="/" class="block py-2">Accueil</RouterLink>
              <RouterLink @click.native="open=false" to="/mobilisations" class="block py-2">Mobilisations</RouterLink>
              <RouterLink @click.native="open=false" to="/association" class="block py-2">Association</RouterLink>
              <RouterLink @click.native="open=false" to="/engagements" class="block py-2">Engagements</RouterLink>
              <RouterLink @click.native="open=false" to="/partenaires" class="block py-2">Partenaires</RouterLink>
              <RouterLink @click.native="open=false" to="/adhesion-dons" class="block py-2">Adhésion & Dons</RouterLink>
              <RouterLink @click.native="open=false" to="/agenda" class="block py-2">Agenda</RouterLink>
              <RouterLink @click.native="open=false" to="/contact" class="block py-2">Contact</RouterLink>
            </div>
          </div>
        </header>

        <main class="flex-1">
          <RouterView />
        </main>

        <footer class="bg-ocean text-white mt-16">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 grid md:grid-cols-3 gap-8">
            <div>
              <div class="font-bold text-lg">Capitaine Ad’Hoc</div>
              <p class="text-white/80 text-sm mt-2">Antibes · Côte d’Azur · France</p>
              <p class="text-white/70 text-xs mt-2">© <span>{{ new Date().getFullYear() }}</span> Association Capitaine Ad’Hoc — Mers & Océans</p>
            </div>
            <div>
              <div class="font-semibold mb-2">Navigation</div>
              <ul class="space-y-1 text-white/80 text-sm">
                <li><RouterLink to="/mobilisations" class="hover:text-lagoon">Mobilisations</RouterLink></li>
                <li><RouterLink to="/engagements" class="hover:text-lagoon">Engagements</RouterLink></li>
                <li><RouterLink to="/partenaires" class="hover:text-lagoon">Partenaires</RouterLink></li>
                <li><RouterLink to="/adhesion-dons" class="hover:text-lagoon">Adhésion & Dons</RouterLink></li>
              </ul>
            </div>
            <div>
              <div class="font-semibold mb-2">Suivre</div>
              <p class="text-white/80 text-sm">#capitaineadhoc · #freepaulwatson · #marineland2050</p>
            </div>
          </div>
        </footer>
      </div>
      `,
      setup(){
        const open = Vue.ref(false);
        return { open };
      }
    }

    // -------------------- Pages --------------------
    const Accueil = { template: `<section class='p-8'><h1 class='text-3xl font-bold'>Accueil</h1></section>` }
    const Mobilisations = { template: `<section class='p-8'><h1 class='text-3xl font-bold'>Mobilisations</h1></section>` }
    const Association = { template: `<section class='p-8'><h1 class='text-3xl font-bold'>Association</h1></section>` }
    const Engagements = { template: `<section class='p-8'><h1 class='text-3xl font-bold'>Engagements</h1></section>` }
    const Partenaires = { template: `<section class='p-8'><h1 class='text-3xl font-bold'>Partenaires</h1></section>` }
    const AdhesionDons = { template: `<section class='p-8'><h1 class='text-3xl font-bold'>Adhésion & Dons</h1></section>` }
    const Agenda = { template: `<section class='p-8'><h1 class='text-3xl font-bold'>Agenda</h1></section>` }
    const Contact = { template: `<section class='p-8'><h1 class='text-3xl font-bold'>Contact</h1></section>` }

    const routes = [
      { path: '/', component: Accueil },
      { path: '/mobilisations', component: Mobilisations },
      { path: '/association', component: Association },
      { path: '/engagements', component: Engagements },
      { path: '/partenaires', component: Partenaires },
      { path: '/adhesion-dons', component: AdhesionDons },
      { path: '/agenda', component: Agenda },
      { path: '/contact', component: Contact },
    ];

    const router = createRouter({ history: createWebHistory(), routes });

    const app = createApp(AppLayout);
    app.use(router);
    app.mount('#app');
  </script>
</body>
</html>
